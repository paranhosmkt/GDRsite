<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gouvêa dos Reis Advogados</title>
    <script>
      // Single Page App fallback redirect for direct sub-route URLs
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (path && path !== "/") {
          window.location.replace("/#" + path + search + hash);
        } else {
          window.location.replace("/");
        }
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background-color: #0b111e; color: #ffffff;">
    <p>Redirecionando para o artigo...</p>
  </body>
</html>
